<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>Karak Rush</title>
  <meta name="description" content="Run a karak stall across Bahrain: 48 levels from Manama Souq to Sakhir Camp, Endless Rush, decorations and special nights.">
  <meta name="theme-color" content="#4a2e6e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Karak Rush">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Lilita+One&family=Reem+Kufi:wght@700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="hud">
      <button class="lvl" id="pauseBtn" type="button" aria-label="Pause"><span id="lvlLabel">Level</span><b id="lvl">1</b></button>
      <div class="goal">
        <div class="row"><span class="money" id="money"><i class="coin"></i><b id="earned">0.000</b></span><span class="served" id="served"></span></div>
        <div class="bar"><i id="goalBar"></i><em id="star1"></em><em id="star2"></em><em id="star3"></em></div>
      </div>
      <button class="pause" id="pauseBtn2" type="button" aria-label="Pause"><i></i><i></i></button>
    </header>

    <section class="street">
      <div class="awning" aria-hidden="true"></div>
      <div class="decor" id="decor" aria-hidden="true"></div>
      <div class="spots" id="spots"><div class="spot"></div><div class="spot"></div><div class="spot"></div></div>
      <div class="counter"><div class="cash"></div><div class="cash"></div><div class="cash"></div></div>
    </section>

    <section class="kitchen">
      <div class="prep">
        <div class="tray" id="tray">
          <span class="tlabel">Your glass</span>
          <button class="bigglass" id="bigGlass" type="button" aria-label="Your glass"></button>
          <div class="spares" id="spares">
            <span class="tlabel small">Next</span>
            <button class="spare" data-i="0" type="button"></button>
            <button class="spare" data-i="1" type="button"></button>
          </div>
        </div>
        <div class="card" id="orderCard"></div>
      </div>

      <div class="tokens" id="tokens"></div>

      <div class="stations">
        <button class="st stove" id="pot" type="button" aria-label="Karak pot"></button>
        <button class="st tawa" id="tawa" type="button" aria-label="Tawa"></button>
        <button class="st fryer" id="fryer" type="button" aria-label="Fryer"></button>
        <div class="warmer" id="warmer"><span>Warmer</span><button class="wm" data-i="0" type="button"></button><button class="wm" data-i="1" type="button"></button></div>
      </div>

      <div class="supplies">
        <button class="sup" id="doughBtn" type="button"></button>
        <button class="sup" id="chickenBtn" type="button"></button>
        <button class="sup" id="samosaBtn" type="button"></button>
        <button class="sup" id="chipsBtn" type="button"></button>
        <button class="sup" id="balaleetBtn" type="button"></button>
        <button class="sup bin" id="binBtn" type="button" aria-label="Throw away the selected glass"></button>
      </div>
    </section>

    <div class="overlay" id="ov"><div class="panel" id="card"></div></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
  </div>
  <script src="js/storage.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
